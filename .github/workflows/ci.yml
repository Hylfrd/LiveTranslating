name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Audit production dependencies
        shell: pwsh
        env:
          NPM_CONFIG_FETCH_TIMEOUT: 60000
          NPM_CONFIG_FETCH_RETRIES: 0
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm audit --omit=dev
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt 3) {
              Write-Warning "npm audit failed on attempt $attempt; retrying in 15 seconds"
              Start-Sleep -Seconds 15
            }
          }
          exit 1
