name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Audit production dependencies
        shell: pwsh
        env:
          NPM_CONFIG_FETCH_TIMEOUT: 60000
          NPM_CONFIG_FETCH_RETRIES: 0
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $output = npm audit --omit=dev --json
            $auditExitCode = $LASTEXITCODE
            $json = $output | Out-String
            if ($auditExitCode -eq 0) {
              $json
              exit 0
            }

            $report = $null
            try {
              $report = $json | ConvertFrom-Json -ErrorAction Stop
            } catch {
              # Network failures do not produce an audit report.
            }

            if ($null -ne $report.metadata.vulnerabilities) {
              $json
              Write-Error "npm audit found $($report.metadata.vulnerabilities.total) production vulnerability entries"
              exit 1
            }

            if ($attempt -lt 3) {
              Write-Warning "npm audit service was unavailable on attempt $attempt; retrying in 15 seconds"
              Start-Sleep -Seconds 15
            }
          }

          Write-Warning "npm audit service remained unavailable after 3 attempts; code verification passed but the remote audit could not run"
          "## Dependency audit`n`nnpm Registry audit service was unavailable after 3 attempts. Typecheck, build, and smoke test passed; no vulnerability report was returned." | Add-Content $env:GITHUB_STEP_SUMMARY
          exit 0
